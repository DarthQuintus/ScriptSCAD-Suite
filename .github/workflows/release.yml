# Builds the installation and update ZIPs and attaches them to a GitHub release.
# Start: push a version tag (v…), or run it by hand (Actions › Release › Run workflow) – then it creates the tag v<version> from version.json itself.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' version.json); else V="${GITHUB_REF_NAME#v}"; fi
          [ -n "$V" ] || { echo "no version"; exit 1; }
          grep -q "const VERSION = '$V'" Scriptable/ScriptSCAD/app/main.js || { echo "main.js is not version $V"; exit 1; }
          grep -q "\"version\": \"$V\"" version.json || { echo "version.json is not version $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build ZIPs
        run: |
          V="${{ steps.v.outputs.version }}"
          D="ScriptSCAD-$V"
          mkdir -p "dist/$D" "dist/update/$D"
          cp -R "Scriptable/ScriptSCAD Studio.js" "Scriptable/ScriptSCAD Slicer.js" Scriptable/ScriptSCAD "dist/$D/"
          cp "shortcut/ScriptSCAD KI.shortcut" LICENSE "dist/$D/"
          cp -R Scriptable/ScriptSCAD/app "dist/update/$D/"
          (cd dist && zip -qr -X "../$D.zip" "$D")
          (cd dist/update && zip -qr -X "../../$D-update.zip" "$D")
          ls -l *.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ScriptSCAD ${{ steps.v.outputs.version }}
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ github.workspace }}/.github/release-notes.md
          files: |
            ScriptSCAD-${{ steps.v.outputs.version }}.zip
            ScriptSCAD-${{ steps.v.outputs.version }}-update.zip
